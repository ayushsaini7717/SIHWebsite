# This is a GitHub Actions workflow file
# Save it in your project as: .github/workflows/main.yml

name: Node.js CI/CD

# Run on every push to the "main" branch
on:
  push:
    branches: [ "main" ]

jobs:
  # -----------------------------------------------
  # Job 1: Build and test the Node.js app
  # -----------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Run build (or tests)
      run: npm run build

  # -----------------------------------------------
  # Job 2: Build and push the Docker image
  # This job will "need" the 'build' job to finish
  # -----------------------------------------------
  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build # <-- This ensures Job 1 finishes first
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: . # Use the root directory as the build context
        push: true # Push the image after building
        # This tags the image as 'ayushsaini07/sihwebsite:latest'
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/sihwebsite:latest